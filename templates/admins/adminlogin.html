<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Dynamic Price Prediction</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;900&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    :root {
      --primary-bg: #0b0f14;
      --secondary-bg: #151a21;
      --accent-color: #00ff9c;
      --text-light: #eafff7;
      --subtle-text: #7fa9a0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: var(--primary-bg);
      color: var(--text-light);
      min-height: 100vh;
      padding-top: 5.5rem;
      background-image:
        radial-gradient(circle at top left, rgba(0,255,156,0.12), transparent 40%),
        radial-gradient(circle at bottom right, rgba(0,255,156,0.12), transparent 40%);
    }

    /* ===== NAVBAR ===== */
    .custom-navbar {
      background-color: rgba(21, 26, 33, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 2px solid rgba(0,255,156,0.4);
    }

    .navbar-brand {
      color: var(--text-light) !important;
      font-weight: 700;
      letter-spacing: 2px;
    }

    .custom-nav-link {
      color: var(--text-light) !important;
      font-size: 0.9rem;
      text-transform: uppercase;
      transition: 0.3s;
    }

    .custom-nav-link:hover {
      color: var(--accent-color) !important;
      background-color: rgba(0,255,156,0.15);
      border-radius: 4px;
    }

    /* ===== CONTENT ===== */
    .content {
      width: 100%;
      display: flex;
      justify-content: center;
      margin-top: 3rem;
    }

    /* ===== LOGIN CARD ===== */
    .form-card {
      background-color: var(--secondary-bg);
      padding: 3rem;
      border-radius: 8px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 0 35px rgba(0,255,156,0.25);
      animation: fadeInUp 1s ease forwards;
      opacity: 0;
    }

    .form-card .title {
      font-size: 2rem;
      font-weight: 900;
      text-align: center;
      margin-bottom: 2rem;
      background: linear-gradient(to right, #6affc9, var(--accent-color));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    label {
      display: block;
      margin-bottom: 0.4rem;
      color: var(--subtle-text);
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 0.75rem;
      margin-bottom: 1.4rem;
      background-color: var(--primary-bg);
      border: 1px solid rgba(0,255,156,0.25);
      border-radius: 3px;
      color: var(--text-light);
      transition: 0.3s;
    }

    input:focus {
      outline: none;
      border-color: var(--accent-color);
      box-shadow: 0 0 6px rgba(0,255,156,0.8);
    }

    /* Button */
    .custom-cta-btn {
      width: 100%;
      background-color: var(--accent-color);
      color: var(--primary-bg);
      border: 2px solid var(--accent-color);
      padding: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-radius: 3px;
      cursor: pointer;
      box-shadow: 0 8px 30px rgba(0,255,156,0.6);
      transition: 0.3s;
    }

    .custom-cta-btn:hover {
      background-color: #00cc7d;
      color: #ffffff;
      transform: scale(1.02);
      box-shadow: 0 12px 40px rgba(0,255,156,0.9);
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 575px) {
      .form-card {
        padding: 2rem 1.5rem;
      }
    }
  </style>
</head>
<body>

  <!-- ===== NAVBAR ===== -->
  <nav class="navbar navbar-expand-lg fixed-top custom-navbar">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">PRICE-PREDICT</a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon" style="filter: invert(1);"></span>
      </button>

      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <div class="navbar-nav">
          <a href="{% url 'home' %}" class="custom-nav-link nav-link mx-2">Home</a>
          <a href="{% url 'login' %}" class="custom-nav-link nav-link mx-2">User</a>
          <a href="{% url 'admin_view' %}" class="custom-nav-link nav-link mx-2">Admin</a>
          <a href="{% url 'register' %}" class="custom-nav-link nav-link mx-2">Register</a>
        </div>
      </div>
    </div>
  </nav>

  <!-- ===== ADMIN LOGIN CARD ===== -->
  <div class="content">
    <div class="form-card">
      <div class="title">Admin Login</div>

      <form method="post">
        {% csrf_token %}

        <label>Username</label>
        <input type="text" name="username" required>

        <label>Password</label>
        <input type="password" name="password" required>

        <input type="submit" value="Login" class="custom-cta-btn">
      </form>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
