<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Price Prediction</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;900&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --primary-bg: #0b0f14;          /* Dark finance background */
            --secondary-bg: #151a21;
            --accent-color: #00ff9c;        /* Neon green (growth & prediction) */
            --text-light: #eafff7;
            --subtle-text: #7fa9a0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--primary-bg);
            color: var(--text-light);
            min-height: 100vh;
            padding-top: 5rem;
            background-image:
                radial-gradient(circle at top left, rgba(0,255,156,0.12), transparent 40%),
                radial-gradient(circle at bottom right, rgba(0,255,156,0.12), transparent 40%);
        }

        /* Navbar */
        .custom-navbar {
            background-color: rgba(21, 26, 33, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 2px solid rgba(0,255,156,0.4);
        }

        .navbar-brand {
            color: var(--text-light) !important;
            letter-spacing: 2px;
            font-weight: 700;
        }

        .custom-nav-link {
            color: var(--text-light) !important;
            font-size: 0.9rem;
            text-transform: uppercase;
            transition: 0.3s;
        }

        .custom-nav-link:hover {
            color: var(--accent-color) !important;
            background-color: rgba(0,255,156,0.15);
            border-radius: 4px;
        }

        /* Title */
        .custom-title {
            font-weight: 900;
            line-height: 1.1;
        }

        .custom-title-gradient {
            background: linear-gradient(to right, #6affc9, var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .display-1 {
            font-size: 2.8rem;
        }

        @media (min-width: 768px) {
            .display-1 {
                font-size: 4rem;
            }
        }

        /* Subtitle */
        .subtitle-text {
            color: var(--subtle-text);
            font-size: 1.2rem;
            letter-spacing: 0.5px;
        }

        /* CTA Button */
        .custom-cta-btn {
            background-color: var(--accent-color);
            color: var(--primary-bg);
            padding: 0.8rem 2.2rem;
            font-weight: 700;
            border-radius: 3px;
            border: 2px solid var(--accent-color);
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 10px 35px rgba(0,255,156,0.6);
            transition: 0.3s;
        }

        .custom-cta-btn:hover {
            background-color: #00cc7d;
            color: #ffffff;
            transform: scale(1.07);
            box-shadow: 0 15px 45px rgba(0,255,156,0.9);
        }

        /* Animations */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .content-item { opacity: 0; }
        .content-item-1 { animation: fadeInUp 1s ease 0.2s forwards; }
        .content-item-2 { animation: fadeInUp 1s ease 0.4s forwards; }
        .content-item-3 { animation: fadeInUp 1s ease 0.6s forwards; }

    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg fixed-top custom-navbar">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">PRICE-PREDICT</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon" style="filter: invert(1);"></span>
            </button>

            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <div class="navbar-nav">
                    <a href="{% url 'home' %}" class="custom-nav-link nav-link mx-2">Home</a>
                    <a href="{% url 'login' %}" class="custom-nav-link nav-link mx-2">User</a>
                    <a href="{% url 'admin_view' %}" class="custom-nav-link nav-link mx-2">Admin</a>
                    <a href="{% url 'register' %}" class="custom-nav-link nav-link mx-2">Register</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container text-center mt-5 pt-5">

        <h1 class="display-1 custom-title content-item content-item-1 mb-4">
            <span class="custom-title-gradient">Dynamic Price</span> Prediction
        </h1>

        <p class="lead subtitle-text content-item content-item-2">
            AI-powered system to analyze market trends and predict prices accurately using machine learning.
        </p>

        <a href="{% url 'register' %}" class="custom-cta-btn mt-5 d-inline-block content-item content-item-3">
            Get Started
        </a>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
