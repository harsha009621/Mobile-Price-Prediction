<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Dynamic Price Prediction</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;900&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --primary-bg: #0b0f14;
            --secondary-bg: #151a21;
            --accent-color: #00ff9c;
            --text-light: #eafff7;
            --subtle-text: #7fa9a0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--primary-bg);
            color: var(--text-light);
            min-height: 100vh;
            padding-top: 6rem;
            background-image:
                radial-gradient(circle at top left, rgba(0,255,156,0.12), transparent 40%),
                radial-gradient(circle at bottom right, rgba(0,255,156,0.12), transparent 40%);
        }

        /* Navbar */
        .custom-navbar {
            position: fixed;
            top: 0;
            width: 100%;
            background-color: rgba(21, 26, 33, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 2px solid rgba(0,255,156,0.4);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
        }

        .navbar-brand {
            color: var(--text-light);
            font-weight: 700;
            letter-spacing: 2px;
            text-decoration: none;
        }

        .nav-links a {
            color: var(--text-light);
            text-decoration: none;
            margin-left: 0.5rem;
            padding: 0.5rem 1rem;
            font-size: 0.85rem;
            text-transform: uppercase;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: var(--accent-color);
            background-color: rgba(0,255,156,0.15);
            border-radius: 4px;
        }

        /* Form Card */
        .content {
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .form-card {
            background-color: var(--secondary-bg);
            width: 100%;
            max-width: 450px;
            padding: 3rem;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(0,255,156,0.25);
            animation: fadeInUp 1s ease forwards;
            opacity: 0;
        }

        .form-card .title {
            font-size: 2rem;
            font-weight: 900;
            text-align: center;
            margin-bottom: 2rem;
            background: linear-gradient(to right, #6affc9, var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        label {
            color: var(--subtle-text);
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 0.4rem;
            display: block;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            margin-bottom: 1.4rem;
            background-color: var(--primary-bg);
            border: 1px solid rgba(0,255,156,0.25);
            color: var(--text-light);
            border-radius: 3px;
            transition: 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 6px rgba(0,255,156,0.8);
        }

        /* Button */
        .custom-cta-btn {
            width: 100%;
            background-color: var(--accent-color);
            color: var(--primary-bg);
            border: 2px solid var(--accent-color);
            padding: 0.8rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-radius: 3px;
            box-shadow: 0 8px 30px rgba(0,255,156,0.6);
            transition: 0.3s;
        }

        .custom-cta-btn:hover {
            background-color: #00cc7d;
            color: #ffffff;
            transform: scale(1.02);
            box-shadow: 0 12px 40px rgba(0,255,156,0.9);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="custom-navbar">
        <a class="navbar-brand" href="#">PRICE-PREDICT</a>
        <div class="nav-links">
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'login' %}">User Login</a>
            <a href="{% url 'admin_view' %}">Admin</a>
            <a href="{% url 'register' %}">Register</a>
        </div>
    </nav>

    <!-- Register Card -->
    <div class="content">
        <div class="form-card">
            <div class="title">Create Account</div>

            <form method="post">
                {% csrf_token %}

                <label>Name</label>
                <input type="text" name="name" required>

                <label>Username</label>
                <input type="text" name="username" required>

                <label>Email</label>
                <input type="email" name="email" required>

                <label>Password</label>
                <input type="password" name="password" required>

                <label>Confirm Password</label>
                <input type="password" name="confirm_password" required>

                <input type="submit" value="Register Account" class="custom-cta-btn">
            </form>
        </div>
    </div>

</body>
</html>
